name: Pipeline de Integração Continúa (CI)

# Gatilhos: Dispara o pipeline em Pushes e Pull Requests na Branch principal
on:
 push:
  Branches:["main,"master]
Pull_request:
  Branches:["main","master"]
jobs:
  testes-e-validacao:
# Define o sistema operacional do Runner(máquina virtual)

runs-on: ubuntu-latest

steps:
#step1: Baixa o código do repositório para o Runner
-name: Baixar Código-Fonte
uses: actions/checkoutt@v4name: Pipeline de Integração Continúa (CI)

