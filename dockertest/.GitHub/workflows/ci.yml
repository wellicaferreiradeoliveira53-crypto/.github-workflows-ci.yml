-name: Baixar Código-Fonte
uses: actions/checkoutt@v4

# Step 2: Configura o ambiente Node.js
-name: Configurar
uses: actions/setup-node@v4

with:
  node-version: '20'
  cache: 'npm'

#step 3: Instala dependencias de formaconsistente
-name: Instalar dependencias
run: npm ci

# step 4: Análise Estática com Linter
-name: Executar Linter
